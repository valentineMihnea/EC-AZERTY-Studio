version: '3.9'

services:
  # PostgreSQL Relational Database (Requirement 2.1)
  db:
    image: postgres:16-alpine
    container_name: azerty_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-azerty_studio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d azerty_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Next.js Application Container (Uncomment in Week 4 once Next.js is initialized)
  # app:
  #   build: .
  #   container_name: azerty_studio_app
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  postgres_data: